name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Demo message (original workflow behavior)
        run: node --input-type=module -e "import { formatDemoMessage } from './src/message.js'; console.log(formatDemoMessage());"

  action-smoke:
    name: Composite action smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Run local composite action
        uses: ./action
        id: demo

      - name: Assert action output
        run: test -n "${{ steps.demo.outputs.message }}"
